[project]
name = "itm-tutor-backend"
version = "0.1.0"
description = "Adaptive tutoring prototype backend: deterministic control layer + LLM tutor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pypdf>=6.16.2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "testcontainers>=4.8",
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's Depends(...) is meant to be used as an argument default.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# pymupdf ships no type stubs; strict mode would otherwise flag every call
# into it as untyped.
module = "app.rag.images"
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Our "register" field (tutor language register) collides in name only
    # with ABCMeta.register(), which pydantic's metaclass also exposes.
    'ignore:Field name "register" in ".*" shadows an attribute in parent "BaseModel":UserWarning',
]
