services:
  db:
    # pgvector-enabled Postgres 16 -- the plain postgres image lacks the
    # `vector` extension that book_chunks needs.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: itm
      POSTGRES_PASSWORD: itm
      POSTGRES_DB: itm_tutor
    # Bound to loopback only -- the dev database must not be reachable from
    # other hosts on the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itm -d itm_tutor"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # Overrides DATABASE_URL from .env: inside the Compose network the database
    # is the `db` service, not localhost (that .env value is for running the
    # backend on the host).
    environment:
      DATABASE_URL: postgresql://itm:itm@db:5432/itm_tutor
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
