services:
  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PDF_PATH=/app/Krcmar2015_ch3.pdf
    volumes:
      - ./backend:/app
      - ./Krcmar2015_ch3.pdf:/app/Krcmar2015_ch3.pdf:ro

  frontend:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
