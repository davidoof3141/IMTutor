version: v1

# Mapping inputs a rule may reference (anything else is a load error):
#   prior_knowledge    the chapter-level level when a chapter diagnostic has run,
#                      otherwise the onboarding seed (prior_knowledge_seed)
#   learning_goal      certification | applied | orientation
#   retention_horizon  within_2_weeks | 1_to_3_months | long_term
#   industry           see industry_* below
# simplified_language / presentation_style are preferences, not mapping inputs.

defaults:
  explanation_depth: 3
  example_density: 3
  concreteness: 3
  example_domain: neutral
  register: neutral
  assessment_frequency: every_second_topic

rules:
  - id: pk_low
    priority: 10
    when: { prior_knowledge: [none, low] }
    set: { explanation_depth: 4, example_density: 4 }

  - id: pk_high
    priority: 10
    when: { prior_knowledge: high }
    set: { explanation_depth: 2, example_density: 2 }

  # Explicit neutral middle: states the default outcome so the mapping table
  # attributes it to the answer instead of showing "Standard".
  - id: pk_moderate
    priority: 10
    when: { prior_knowledge: moderate }
    set: { explanation_depth: 3, example_density: 3 }

  - id: goal_certification
    priority: 8
    when: { learning_goal: certification }
    set: { assessment_frequency: every_topic }

  - id: goal_orientation
    priority: 8
    when: { learning_goal: orientation }
    set: { assessment_frequency: on_request }

  # Below the goal rules (priority 8): the goal decides when it states a
  # preference for checkpoints; the retention horizon decides for "applied",
  # which has no checkpoint preference of its own.
  - id: retention_within_2_weeks
    priority: 7
    when: { retention_horizon: within_2_weeks }
    set: { assessment_frequency: on_request }

  - id: retention_1_to_3_months
    priority: 7
    when: { retention_horizon: 1_to_3_months }
    set: { assessment_frequency: every_second_topic }

  - id: retention_long_term
    priority: 7
    when: { retention_horizon: long_term }
    set: { assessment_frequency: every_topic }

  # Branche -> Beispielwelt. A deliberate 1:1 pass-through rather than reading
  # profile.industry straight into the prompt: routing it through the rule set
  # keeps example_domain overridable and attributable like every other
  # parameter, so a learner can switch example world without re-onboarding.
  - id: industry_manufacturing
    priority: 10
    when: { industry: manufacturing }
    set: { example_domain: manufacturing }

  - id: industry_finance
    priority: 10
    when: { industry: finance }
    set: { example_domain: finance }

  - id: industry_public_sector
    priority: 10
    when: { industry: public_sector }
    set: { example_domain: public_sector }

  - id: industry_healthcare
    priority: 10
    when: { industry: healthcare }
    set: { example_domain: healthcare }

  - id: industry_retail
    priority: 10
    when: { industry: retail }
    set: { example_domain: retail }

  - id: industry_it_software
    priority: 10
    when: { industry: it_software }
    set: { example_domain: it_software }

  - id: industry_logistics
    priority: 10
    when: { industry: logistics }
    set: { example_domain: logistics }

  - id: industry_energy
    priority: 10
    when: { industry: energy }
    set: { example_domain: energy }

  - id: industry_consulting
    priority: 10
    when: { industry: consulting }
    set: { example_domain: consulting }

  - id: industry_neutral
    priority: 10
    when: { industry: neutral }
    set: { example_domain: neutral }
